# The old address (pacific-rim-ww3.netlify.app) after the move to Cloudflare Pages (1.0.16):
# it only serves the "We've moved" page, which carries players' saves to the new site.
# Netlify deploys are paused until the team's credits reset on 29 Nov 2026; the next deploy after that publishes this.
# Once it's live, press "Lock to stop auto publishing" on Netlify so later pushes don't spend credits.
[build]
  publish = "moved"
  command = ""

[functions]
  directory = "netlify/none"

[[redirects]]
  from = "/discord"
  to = "https://discord.gg/jv8T6Pxz3e"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
