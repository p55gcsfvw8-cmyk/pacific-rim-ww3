<meta charset="utf-8">
<title>Pacific Rim WW3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed theatre map; command HUD on top, dock at the bottom, every detail in one bottom sheet. */
:root {
  --abyss: #061120;
  --panel: #0c1a2a;
  --panel-2: #132639;
  --panel-3: #1a3048;
  --line: #24394f;
  --ink: #e6edf4;
  --muted: #8da2b8;
  --signal: #f5b84a;
  --signal-ink: #1f1505;
  --friendly: #9fd8ff;
  --neutral: #b7efa6;
  --hostile: #ff8b7e;
  --good: #7ddc8b;
  --bad: #ff7b6b;
  --land-lane: #b6e86f;
  --sea-lane: #4cc3ff;
  --air-lane: #f1f4f8;
  --f-display: "Chakra Petch", "Barlow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--abyss); color: var(--ink); font-family: var(--f-body); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.glass { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* ---------- top HUD ---------- */
.hud-top { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 10px) 0 calc(env(safe-area-inset-left, 0px) + 10px); }
.hud-top > * { pointer-events: auto; }
.cmd { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 7px 8px 7px 10px; min-width: 0; }
.cmd .who { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.cmd .flag { width: 26px; height: 26px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.cmd .who span { display: flex; flex-direction: column; min-width: 0; }
.cmd .who b { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd .who small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-radius: 12px; padding: 5px; }
.res::-webkit-scrollbar { display: none; }
.res button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 8px; border: 0; background: var(--panel-2); cursor: pointer; }
.res svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.res b { font-family: var(--f-mono); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.res small { font-family: var(--f-mono); font-size: 10px; font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.scale { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); padding-left: 4px; }
.scale i { display: block; height: 5px; border: 1.5px solid var(--ink); border-top: 0; opacity: .7; }

/* ---------- dock ---------- */
.dock-wrap { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding: 0 calc(env(safe-area-inset-right, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 10px);
  transform: translateY(calc(-1 * var(--sheet-h, 0px))); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.dock-wrap > * { pointer-events: auto; }
.zoomrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-bottom: 8px; max-width: 560px; margin-inline: auto; transition: opacity .2s; }
.dock-wrap > .zoomrow { pointer-events: none; }
.zoomrow > * { pointer-events: auto; }
.sheet-open .zoomrow { opacity: 0; }
.sheet-open .zoomrow > * { pointer-events: none; }
.zoom { display: flex; flex-direction: column; gap: 6px; }
.zoomrow .scale { padding: 4px 8px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 80%, transparent); }
.zbtn { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; font-size: 20px; color: var(--ink); }
.zbtn svg { width: 16px; height: 16px; }
.dock { display: flex; gap: 4px; padding: 5px; border-radius: 14px; max-width: 560px; margin: 0 auto; }
.dock button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 50px; padding: 4px 2px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; color: var(--muted);
  font-family: var(--f-display); font-weight: 600; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; position: relative; }
.dock button svg { width: 19px; height: 19px; }
.dock button:hover { background: var(--panel-2); color: var(--ink); }
.dock button.end { flex: 1.35; background: var(--signal); color: var(--signal-ink); }
.dock button.end span.t { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0; opacity: .8; text-transform: none; }
.dock .dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--panel); }

/* ---------- banners & toast ---------- */
.mode-banner { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 104px);
  max-width: 540px; margin: 0 auto; background: var(--signal); color: var(--signal-ink); border-radius: 11px; padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 10px;
  font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.mode-banner span { flex: 1; min-width: 0; line-height: 1.3; }
.mode-banner button { flex: none; border: 0; background: rgba(0,0,0,.15); border-radius: 8px; min-height: 34px; padding: 0 12px; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px + var(--sheet-h, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  background: #22364b; color: var(--ink); border: 1px solid #36506b; border-radius: 10px; padding: 9px 13px; font-size: 13.5px; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 30; }

/* ---------- sheet ---------- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; max-height: min(64vh, 620px); display: flex; flex-direction: column; z-index: 20;
  background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.45);
  transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s linear .26s; visibility: hidden; }
.sheet.open { transform: translateY(0); visibility: visible; transition: transform .26s cubic-bezier(.2,.8,.2,1), visibility 0s; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); touch-action: none; cursor: grab; }
.sheet-head .handle { flex: 1; display: flex; justify-content: center; padding-left: 44px; }
.sheet-head .handle i { width: 40px; height: 4px; border-radius: 2px; background: #3a5874; }
.sheet-head .close { flex: none; width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.sheet .body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); }
.eyebrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; }
.pill { font-family: var(--f-display); font-weight: 700; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.cap { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.pill.city { color: var(--ink); border-color: #4b6884; }
.pill.port { color: var(--sea-lane); border-color: color-mix(in srgb, var(--sea-lane) 50%, transparent); }
.pill.st-N { color: var(--neutral); border-color: color-mix(in srgb, var(--neutral) 40%, transparent); }
.pill.st-P { color: #d7c27a; border-color: #6b5f36; }
.pill.st-A { color: var(--friendly); border-color: color-mix(in srgb, var(--friendly) 45%, transparent); }
.pill.st-W { color: #1c0705; background: var(--hostile); border-color: var(--hostile); }
.pill.fog { color: #aab4c0; border-style: dashed; }
.sheet h2 { margin: 2px 0 2px; font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.1; letter-spacing: .02em; text-wrap: balance; }
.where { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14.5px; flex-wrap: wrap; }
.flagsw { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); flex: none; display: inline-block; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: #4b6884; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin: 12px 0 4px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats > div { background: var(--panel-2); padding: 8px 10px 9px; min-width: 0; }
.stats dt { font-family: var(--f-display); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.stats dd { margin: 3px 0 0; font-family: var(--f-mono); font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats dd small { font-size: 10.5px; color: var(--muted); }
.section-title { margin: 18px 0 8px; font-family: var(--f-display); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.section-title small { font-family: var(--f-mono); letter-spacing: 0; text-transform: none; font-size: 11px; }
.nbrs { display: flex; flex-wrap: wrap; gap: 6px; }
.nbr { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 13.5px; max-width: 100%; }
.nbr i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.nbr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { margin: 12px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.lanes { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 2px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lanes span { display: inline-flex; align-items: center; gap: 6px; }
.lanes i { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
  font-family: var(--f-display); font-weight: 600; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: #3d5a78; }
.btn.primary { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.btn.danger { background: transparent; color: var(--hostile); border-color: color-mix(in srgb, var(--hostile) 45%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* rows */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; width: 100%; }
.tpick .row { cursor: pointer; color: inherit; font: inherit; } .tpick .row.on { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
button.row { cursor: pointer; }
.row .t { font-weight: 600; font-size: 14.5px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.row .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { grid-column: 1; font-size: 12px; color: var(--muted); font-family: var(--f-mono); line-height: 1.45; }
.row .r { grid-row: span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row .cost { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.row.sel { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
.row.unit { grid-template-columns: 40px minmax(0, 1fr) auto; }
.row.unit canvas { grid-row: span 2; }
.row.unit .s { grid-column: 2; }
.row.unit .r { grid-column: 3; }
.hpbar { width: 64px; height: 5px; border-radius: 3px; background: #2a3c50; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--good); }
.relbar { position: relative; width: 84px; height: 6px; border-radius: 3px; background: #24384d; }
.relbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.relbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #5c7792; }
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin-top: 4px; }
.trait { font-size: 12px; color: var(--muted); }
.trait div { height: 5px; border-radius: 3px; background: #24384d; margin-top: 4px; overflow: hidden; }
.trait div i { display: block; height: 100%; background: var(--signal); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); background: color-mix(in srgb, var(--signal) 12%, var(--panel-2)); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.fx { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.log { display: flex; flex-direction: column; gap: 2px; }
.log p { margin: 0; padding: 8px 10px; border-left: 3px solid var(--line); background: var(--panel-2); border-radius: 0 8px 8px 0; font-size: 13.5px; line-height: 1.4; }
.log p.war { border-left-color: var(--hostile); }
.log p.dip { border-left-color: var(--friendly); }
.log p.eco { border-left-color: var(--good); }
.log p.ai { border-left-color: var(--signal); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.switch { width: 46px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-2); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.switch[aria-pressed="true"] { background: color-mix(in srgb, var(--signal) 35%, var(--panel-2)); border-color: var(--signal); }
.switch[aria-pressed="true"]::after { left: 21px; background: var(--signal); }

/* ---------- start screen ---------- */
.start { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: linear-gradient(180deg, rgba(6,17,32,.82), rgba(6,17,32,.96) 40%);
  padding: calc(env(safe-area-inset-top, 0px) + 28px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(16px, env(safe-area-inset-left, 0px)); }
.start-in { max-width: 720px; margin: 0 auto; }
#menuFx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 39; display: block; pointer-events: none; background: #040a14; }
#menuFx[hidden] { display: none; }
.start.hero, .start.slim { background: linear-gradient(180deg, rgba(6,17,32,0) 0, rgba(6,17,32,0) calc(var(--band, 300px) - 30px), rgba(6,17,32,.92) calc(var(--band, 300px) + 40px), rgba(6,17,32,.97) calc(var(--band, 300px) + 260px)); background-attachment: local; }
.hero-pad { height: calc(var(--band, 300px) - 28px - env(safe-area-inset-top, 0px)); display: flex; align-items: flex-start; }
.start.slim .hero-pad { margin-bottom: 4px; }
.start.slim .fxcap span { display: none; }
.start.slim .fxcap { padding: 6px 10px; }
.budget { box-shadow: 0 -40px 0 0 #071324, 0 10px 24px rgba(0,0,0,.45); }
.fxcap { display: inline-flex; flex-direction: column; gap: 3px; padding: 8px 12px; border-radius: 10px; background: rgba(6,17,32,.62); border: 1px solid rgba(255,255,255,.1); max-width: 36ch; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.fxcap:empty { display: none; }
.fxcap b { font-family: var(--f-display); font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--signal); }
.fxcap span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.menu { display: grid; gap: 10px; margin-top: 18px; }
.menu .btn.big { min-height: 58px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 8px 16px; text-align: left; }
.menu .btn.big span { font-size: 16px; font-weight: 700; }
.menu .btn.big small { font-size: 12px; opacity: .78; font-weight: 500; text-transform: none; letter-spacing: 0; }
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.coach { position: fixed; left: 50%; transform: translateX(-50%); width: min(92vw, 460px); top: 200px; z-index: 46; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(245,184,74,.55); background: rgba(10,22,38,.96); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
.coach[hidden] { display: none; }
.coach.tip { border-color: rgba(127,194,255,.55); z-index: 45; }
.coach.tip b { color: #9fd8ff; }
.coach .linkbtn { margin-left: 4px; }
.cmdbar { position: sticky; top: 0; z-index: 3; margin: 10px -14px 4px; padding: 10px 14px; background: linear-gradient(180deg, var(--panel) 85%, rgba(0,0,0,0)); border-bottom: 1px solid var(--line); }
.cmdbar.tabsonly { padding-top: 6px; padding-bottom: 8px; }
.ztabs { display: flex; gap: 4px; margin-top: 9px; }
.cmdbar.tabsonly .ztabs { margin-top: 0; }
.ztab { flex: 1 1 0; min-width: 0; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font: 700 11.5px var(--f-display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.ztab small { font: 600 10.5px var(--f-body); color: inherit; opacity: .8; }
.ztab.on { border-color: var(--signal); background: rgba(245,184,74,.12); color: var(--signal); }
.ztabpane { padding-top: 4px; }
.cmdhint { font-size: 12.5px; color: var(--muted); margin-bottom: 7px; } .cmdhint b { color: var(--signal); }
.cmdbtns { display: flex; flex-wrap: wrap; gap: 8px; } .cmdbtns .btn { min-height: 40px; }
.cmdbats { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; }
.bchip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(12,26,42,.9); color: var(--ink); font: 600 12.5px var(--f-body); cursor: pointer; }
.bchip.on { border-color: var(--signal); color: var(--signal); }
.bchip .ech { font: 700 10px var(--f-display); color: var(--muted); }
.uchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.uchip { position: relative; display: grid; place-items: center; width: 48px; height: 40px; border-radius: 9px; border: 1px solid var(--line); background: rgba(12,26,42,.85); cursor: pointer; padding: 0; overflow: hidden; }
.uchip canvas { width: 34px !important; height: 26px !important; }
.uchip i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--good); }
.uchips .more { align-self: center; font-size: 12px; color: var(--muted); }

const projY = lat => Math.log(Math.tan(Math.PI / 4 + lat * DEG / 2)) / DEG;

{

{

}

  if (b.dataset.build) { const err = queueBuilding(P, sheetView.arg, b.dataset.build); toast(err || `${BLD[b.dataset.build].name} under construction.`); updateHud(); refreshSheet(); save(); return; }

  if (b.dataset.goto != null) { const z = +b.dataset.goto; flyTo({ x: Z[z].x, y: Z[z].y - 30 / Math.max(cam.s, 24), s: Math.max(cam.s, 24) }); showZone(z); return; }
  if (b.dataset.z) { const z = +b.dataset.z; showZone(z); flyTo({ x: Z[z].x, y: Z[z].y - 40 / Math.max(cam.s, 22), s: Math.max(cam.s, isLand(z) ? 22 : 14) }); return; }

// SCORE AND HI-SCORES

// Score: ground held, ground taken, enemies destroyed, minus losses; a win adds a bonus that grows the faster it came.
function scoreParts(g = G) {
  const P = g.player, st = g.stats || {}, share = vp(P) / TOTAL_VP;
  const parts = { held: Math.round(share * 100) * 40, taken: (st.caps || 0) * 25 + (st.capitals || 0) * 250 + (st.mcaps || 0) * 75, kills: (st.kills || 0) * 15, losses: -(st.lost || 0) * 5, victory: g.over && g.over.win ? 2000 + Math.max(0, 120 - g.turn) * 15 : 0 };
  parts.total = Math.max(0, Object.values(parts).reduce((a, b) => a + b, 0));
  return parts;
}
const SCORE_KEY = "prww3-scores";
// When the game moves to its own website, point this at the leaderboard server:
// POST <endpoint> with a score entry (JSON) to submit; GET <endpoint>?top=N returns the top N entries as a JSON array.
const hiscoreURL = () => (typeof API !== "undefined" && API != null ? API + "/api/scores" : ""); // the API constant is defined further down
const POSTED = {}; // gid -> last turn sent
const SCORES = {
  local() { try { const l = JSON.parse(localStorage.getItem(SCORE_KEY) || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; } },
  record(e) {
    const l = this.local().filter(x => x.gid !== e.gid); l.push(e); l.sort((a, b) => b.score - a.score);
    try { localStorage.setItem(SCORE_KEY, JSON.stringify(l.slice(0, 100))); } catch (er) {}
    if (hiscoreURL() && (e.final || POSTED[e.gid] !== e.turn)) { POSTED[e.gid] = e.turn; fetch(hiscoreURL(), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(e), keepalive: true }).catch(() => {}); }
  },
  async top(n = 20) {
    if (hiscoreURL()) { try { const r = await fetch(hiscoreURL() + "?top=" + n, { cache: "no-store" }); if (r.ok) { const j = await r.json(); if (Array.isArray(j)) return { list: j, online: true }; } } catch (e) {} }
    return { list: this.local().slice(0, n), online: false };
  },
};
function recordScore() {
  if (!G || !USER || G.tutorial) return;
  G.gid = G.gid || Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const p = scoreParts();
  SCORES.record({ gid: G.gid, name: USER, nation: C[G.player].code, score: p.total, turn: G.turn, result: G.over ? (G.over.win ? "Victory" : "Defeat") : "In progress", vp: Math.round(vp(G.player) / TOTAL_VP * 100), at: Date.now(), v: VERSION, final: !!G.over });
}
// tally this turn's kills, losses and captures for the score
function tallyTurn(ev, pre) {
  const P = G.player, st = G.stats = G.stats || { kills: 0, lost: 0, caps: 0, capitals: 0 };
  for (const e of ev) {
    if (e.type === "volley") for (const s of e.shots) { if (s.kill && s.fo === P && s.v >= 0) st.kills++; }
    else if (e.type === "strike") { if (e.kill && e.o === P) st.kills++; }
    else if (e.type === "die") { const p = pre.get(e.id); if (p && p.o === P) st.lost++; }
    else if (e.type === "cap" && e.o === P) { st.caps++; if (Z[e.z].t === "cap") { if (Z[e.z].mx) st.mcaps = (st.mcaps || 0) + 1; else st.capitals++; } }
  }
}

  const ua = navigator.userAgent, dev = /iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Other";
  const br = /CriOS|Chrome/.test(ua) ? "Chrome" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "Browser";
  const L = [`Build: Pacific Rim WW3 v${VERSION}${window.claude ? " (Claude app)" : " (web)"}`, `Device: ${dev} · ${br} · screen ${innerWidth}×${innerHeight} @${(devicePixelRatio || 1).toFixed(1)}x`, `Commander: ${USER || "(none)"}`];
  if (G) { const s = scoreParts(); L.push(`Game: ${shortName(G.player)} · turn ${G.turn} · score ${s.total} · ${G.units.filter(u => u.o === G.player).length} units · ${Object.values(G.st).filter(v => v === "W").length} wars · id ${G.gid || "-"}`); if (UI.sel >= 0 && Z[UI.sel]) L.push(`Selected cell: ${Z[UI.sel].n}`); }
  else L.push(`Screen: ${MENU.view}`);

}
// inside Claude the viewer's app hands the file over (downloads capability); on the web it's a plain download

  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (dl) { try { await dl.save({ filename, data: saveJson() }); return true; } catch (e) { return false; } }
  }
  try {
    const blob = new Blob([saveJson()], { type: "application/json" }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true;
  } catch (e) { return false; }
}

// a save file sent by a playtester (or your own backup) loads as a commander's game
function importSave(file, name) {
  const rd = new FileReader();
  rd.onload = () => {
    let s = null; try { s = reviveSave(JSON.parse(rd.result)); } catch (e) {}
    if (!s) { MENU.err = "That file isn't a Pacific Rim WW3 save."; showName("load"); return; }
    setUser(name); G = s; if (!G.gid) G.gid = Date.now().toString(36); invalidate(); save(); $("start").hidden = true; MENU_FX.stop(); afterStart();
  };

async function apiCall(path, body) {

    const r = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: true } : { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

}
